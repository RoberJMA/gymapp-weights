  /* ---------- guardado ---------- */
  function setStatus() {
    const el = $("#status"); if (!el) return;
    el.textContent = S.error ? "Sin guardar" : (inflight > 0 || dirty.size > 0) ? "Guardando…" : (S.loaded ? "Guardado" : "");
  }
  function enqueue(key, fn) {
    inflight++; setStatus();
    queues[key] = (queues[key] || Promise.resolve()).then(fn).then(() => { S.error = ""; }, e => {
      S.error = "No se pudo guardar" + (e && e.message ? " (" + e.message + ")" : "") + ". Tus datos siguen en pantalla; revisa la conexión.";
      render();
    }).then(() => { inflight--; setStatus(); });
    return queues[key];
  }
  function saveLocal() {
    try { localStorage.setItem("cuaderno-pesas-v1", JSON.stringify({ settings: S.settings, weights: S.weights, sessions: S.sessions })); } catch (e) { /* sin almacenamiento */ }
    setStatus();
  }
  function saveSettings() {
    if (P.mode === "cloud") { const body = clone(S.settings); enqueue("settings", () => P.settingsRef.set(body)); } else saveLocal();
  }
  function saveSettingsSoon() { clearTimeout(saveTimer); dirty.add("__settings"); setStatus(); saveTimer = setTimeout(() => { dirty.delete("__settings"); saveSettings(); }, 500); }
  function saveWeight(date, kg) {
    if (P.mode === "cloud") enqueue("w_" + date, () => P.weightsCol.doc(date).set({ date, kg })); else saveLocal();
  }
  function deleteWeight(date) {
    if (P.mode === "cloud") enqueue("w_" + date, () => P.weightsCol.doc(date).delete()); else saveLocal();
  }
  function cleanDoc(doc) {
    const entries = (doc.entries || []).map(e => ({ n: e.n, s: e.s.map(x => ({ k: x.k == null ? null : x.k, r: x.r == null ? null : x.r })) }))
      .filter(e => e.s.some(x => x.k != null || x.r != null));
    return { date: doc.date, session: doc.session, week: doc.week, entries };
  }
  function flushSession(id) {
    clearTimeout(timers[id]);
    const doc = S.sessions[id]; if (!doc) { dirty.delete(id); return; }
    const body = cleanDoc(doc); const v = vers[id];
    if (P.mode === "cloud") {
      enqueue("s_" + id, async () => {
        if (body.entries.length) await P.sessionsCol.doc(id).set(body); else await P.sessionsCol.doc(id).delete();
        if (vers[id] === v) dirty.delete(id);
      });
    } else { if (!body.entries.length) delete S.sessions[id]; else S.sessions[id] = body; dirty.delete(id); saveLocal(); }
  }
  function scheduleSession(id) {
    dirty.add(id); vers[id] = (vers[id] || 0) + 1; setStatus();
    clearTimeout(timers[id]); timers[id] = setTimeout(() => flushSession(id), 700);
  }
  function flushAll() { Object.keys(timers).forEach(id => { if (dirty.has(id)) flushSession(id); }); if (dirty.has("__settings")) { clearTimeout(saveTimer); dirty.delete("__settings"); saveSettings(); } }
  document.addEventListener("visibilitychange", () => { if (document.hidden) flushAll(); });
  window.addEventListener("pagehide", flushAll);

  async function initStore() {
    let db = null, user = null, uid = null;
    const C = window.claude;
    try { if (C && C.use) { db = await C.use("db"); user = await C.use("user"); uid = user ? await user.id() : null; } } catch (e) { db = null; }
    if (db && uid) {
      P = { mode: "cloud" }; S.mode = "cloud";
      P.settingsRef = db.collection("data/users/" + uid).doc("settings");
      P.weightsCol = P.settingsRef.collection("weights");
      P.sessionsCol = P.settingsRef.collection("sessions");
      const timer = setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000);
      const onErr = e => { S.error = "No se pueden leer los datos (" + ((e && e.code) || "error") + ")."; render(); };
      P.settingsRef.onSnapshot(snap => {
        if (snap.exists) { if (!dirty.has("__settings")) S.settings = clone(snap.data()); S.loaded = true; S.slow = false; clearTimeout(timer); }
        else if (!snap.metadata.fromCache) { S.settings = null; S.loaded = true; S.slow = false; clearTimeout(timer); }
        softRender();
      }, onErr);
      P.weightsCol.onSnapshot(q => {
        const w = {}; q.docs.forEach(d => { const x = d.data(); if (x && typeof x.kg === "number") w[d.id] = x.kg; });
        S.weights = w; softRender();
      }, onErr);
      P.sessionsCol.onSnapshot(q => {
        const s = {}; q.docs.forEach(d => { s[d.id] = clone(d.data()); });
        dirty.forEach(id => { if (S.sessions[id]) s[id] = S.sessions[id]; });
        S.sessions = s;
        if (!q.metadata.fromCache && !S.sLoaded) { S.sLoaded = true; if (!S.sesTouched) S.ses = null; }
        softRender();
      }, onErr);
    } else {
      P = { mode: "local" }; S.mode = "local";
      try { const raw = JSON.parse(localStorage.getItem("cuaderno-pesas-v1") || "null"); if (raw) { S.settings = raw.settings || null; S.weights = raw.weights || {}; S.sessions = raw.sessions || {}; } } catch (e) { /* vacío */ }
      S.loaded = true; render();
    }
  }

  /* ---------- historial y sugerencias ---------- */
  function historyFor(name, excludeId) {
    const out = [];
    Object.keys(S.sessions).forEach(id => {
      if (id === excludeId) return;
      const d = S.sessions[id]; if (!d || !d.entries) return;
      const e = d.entries.find(x => x.n === name);
      if (e) out.push({ date: d.date, week: d.week, s: e.s });
    });
    out.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    return out;
  }
  function fmtLast(last) {
    const ks = last.s.map(x => x.k), rs = last.s.map(x => x.r == null ? "-" : fmt(x.r));
    const kk = ks.filter(v => v != null);
    const same = kk.length && kk.every(v => v === kk[0]);
    return (same ? fmt(kk[0]) + " kg · " + rs.join(" / ") : last.s.map(x => (x.k == null ? "-" : fmt(x.k)) + "×" + (x.r == null ? "-" : fmt(x.r))).join(" · ")) + " (" + fmtDate(last.date) + ")";
  }
  const sessionId = (date, ses) => date + "_" + SLUG[ses];
  function resumeSession() {
    const today = Object.keys(S.sessions).map(k => S.sessions[k]).filter(d => d && d.date === S.date && SES.indexOf(d.session) >= 0);
    if (!today.length) return null;
    today.sort((a, b) => SES.indexOf(a.session) - SES.indexOf(b.session));
    return today[today.length - 1].session;
  }
  function allThreeDone(week) {
    const got = new Set();
    Object.keys(S.sessions).forEach(id => { const d = S.sessions[id]; if (d && d.week === week) got.add(d.session); });
    return SES.every(s => got.has(s));
  }

  /* ---------- gráficos ---------- */
  function niceStep(r) { const p = Math.pow(10, Math.floor(Math.log10(r))); const f = r / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
  function lineChart(pts, opt) {
    opt = opt || {};
    const W = 640, H = 230, L = 46, R = 18, T = 16, B = 30;
    if (!pts.length) return '<p class="muted">Aún no hay datos para dibujar.</p>';
    const ys = pts.map(p => p.y); if (opt.goal != null) ys.push(opt.goal);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (hi - lo < 2) { lo -= 1; hi += 1; }
    const step = niceStep((hi - lo) / 3); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x0 = pts[0].x, x1 = pts[pts.length - 1].x;
    const X = x => L + (x1 === x0 ? (W - L - R) / 2 : (x - x0) / (x1 - x0) * (W - L - R));
    const Y = y => T + (hi - y) / (hi - lo) * (H - T - B);
    let g = "";
    for (let v = lo; v <= hi + 1e-9; v += step) g += '<line class="c-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="c-txt" x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + fmt(v) + "</text>";
    let goal = "";
    if (opt.goal != null) goal = '<line class="c-goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(opt.goal) + '" y2="' + Y(opt.goal) + '"/><text class="c-goal-t" x="' + (W - R) + '" y="' + (Y(opt.goal) - 5) + '" text-anchor="end">Meta ' + fmt(opt.goal) + "</text>";
    const line = pts.length > 1 ? '<polyline class="c-line" points="' + pts.map(p => X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join(" ") + '"/>' : "";
    const dots = pts.map(p => '<circle class="c-dot" cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="3.5"/>').join("");
    const last = pts[pts.length - 1];
    const lastT = '<text class="c-txt" style="font-weight:600" x="' + Math.min(X(last.x), W - R - 14) + '" y="' + (Y(last.y) - 9) + '" text-anchor="middle">' + fmt(last.y) + "</text>";
    const dx = '<text class="c-txt" x="' + L + '" y="' + (H - 8) + '" text-anchor="start">' + fmtDate(pts[0].d) + '</text><text class="c-txt" x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + (pts.length > 1 ? fmtDate(last.d) : "") + "</text>";
    return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(opt.label || "Gráfico") + '">' + g + goal + line + dots + lastT + dx + "</svg>";
  }

  /* ---------- vistas ---------- */
  function viewOnboarding() {
    return '<section class="card"><h2 style="font-size:28px">Empezamos</h2><p class="muted">Pon tus datos de partida. Puedes cambiarlos cuando quieras en Ajustes.</p>' +
      '<div class="row"><label class="field"><span class="lbl">Peso actual (kg)</span><input id="o-w" inputmode="decimal" value="78"></label>' +
      '<label class="field"><span class="lbl">Meta (kg)</span><input id="o-g" inputmode="decimal" value="75"></label></div>' +
      '<div class="row"><label class="field"><span class="lbl">Altura (m)</span><input id="o-h" inputmode="decimal" value="1,72"></label>' +
      '<label class="field"><span class="lbl">Inicio de la semana 1</span><input id="o-s" type="date" value="2026-11-09"></label></div>' +
      '<button class="btn pri" data-act="onboard">Guardar y empezar</button></section>';
  }
  function viewHoy() {
    const st = S.settings, week = st.week || 1, bi = blockInfo(week);
    if (!S.ses) S.ses = resumeSession() || nextSession(S.sessions);
    const suggested = nextSession(S.sessions);
    const id = sessionId(S.date, S.ses), doc = S.sessions[id];
    const items = planFor(week, S.ses);
    let h = '<section class="card"><div class="wk"><div><div class="lbl">Semana</div><div class="wk-big">' + week + '</div>' +
      '<div class="wk-sub">Bloque ' + bi.block + " · semana " + bi.wk + " de 6" + (bi.deload ? ' <span class="badge deload">DELOAD 60%</span>' : "") + '</div></div>' +
      '<div class="step"><button class="btn" data-act="wk-" aria-label="Semana anterior">−</button><button class="btn" data-act="wk+" aria-label="Semana siguiente">+</button></div></div>' +
      '<div class="seg" role="group" aria-label="Sesión">' + SES.map(s => '<button data-ses="' + esc(s) + '" aria-pressed="' + (s === S.ses) + '">' + esc(s) + (s === suggested ? "<small>toca hoy</small>" : "<small>&nbsp;</small>") + "</button>").join("") + "</div>" +
      '<label class="field" style="flex:none"><span class="lbl">Fecha</span><input id="dateIn" type="date" value="' + esc(S.date) + '"></label></section>';
    if (bi.deload) h += '<div class="banner">Semana de deload: usa el 60% del peso de siempre. Las cifras sugeridas ya lo aplican.</div>';
    items.forEach((it, i) => {
      const hist = historyFor(it.n, id), last = pickLast(hist), sg = suggest(last, it.tipo, it.sr, bi.deload);
      const e = doc && doc.entries ? doc.entries.find(x => x.n === it.n) : null;
      const time = isTime(it.sr), noKg = time;
      let hint = "";
      if (last) hint = "Última vez: " + fmtLast(last) + (sg.msg ? '<br><b>' + esc(sg.msg) + "</b>" : "");
      else hint = "<b>" + esc(sg.msg) + "</b>";
      h += '<article class="card ex"><div class="ex-head"><span class="ex-n">' + (i + 1) + "</span><h3>" + esc(it.n) + '</h3><span class="badge ' + (it.tipo === "Básico" ? "basic" : "") + '">' + it.tipo + "</span></div>" +
        '<p class="target">' + esc(it.sr) + " · descanso " + esc(it.rest) + "</p>" + (hint ? '<p class="hint' + (sg.up ? " up" : "") + '">' + hint + "</p>" : "") + '<div class="sets">';
      for (let j = 0; j < 3; j++) {
        const sv = e && e.s[j] ? e.s[j] : {};
        const kg = sv.k == null ? "" : sv.k, rp = sv.r == null ? "" : sv.r;
        h += '<div class="set' + (noKg ? " nokg" : "") + '"><span class="sn">Serie ' + (j + 1) + "</span>" +
          (noKg ? "" : '<input data-ex="' + i + '" data-set="' + j + '" data-f="k" inputmode="decimal" aria-label="Kilos serie ' + (j + 1) + '" placeholder="' + (sg.kg != null ? fmt(sg.kg) : "kg") + '" value="' + esc(kg) + '"><span class="u">kg</span>') +
          '<input data-ex="' + i + '" data-set="' + j + '" data-f="r" inputmode="numeric" aria-label="' + (time ? "Segundos" : "Repeticiones") + " serie " + (j + 1) + '" placeholder="' + (time ? "s" : "reps") + '" value="' + esc(rp) + '"><span class="u">' + (time ? "s" : "reps") + "</span></div>";
      }
      h += "</div>" + (sg.kg != null && !noKg ? '<button class="btn sm ghost" data-act="fill" data-ex="' + i + '" data-kg="' + sg.kg + '">Usar ' + fmt(sg.kg) + " kg en las 3 series</button>" : "") + "</article>";
    });
    if (allThreeDone(week)) h += '<section class="card"><p>Ya registraste las 3 sesiones de la semana ' + week + '.</p><button class="btn pri" data-act="wk+">Pasar a la semana ' + (week + 1) + "</button></section>";
    return h;
  }
  function sortedWeights() { return Object.keys(S.weights).sort().map(d => ({ d, kg: S.weights[d] })); }
  function viewPeso() {
    const st = S.settings, ws = sortedWeights(), goal = st.goal, ht = st.height;
    const cur = ws.length ? ws[ws.length - 1].kg : null, first = ws.length ? ws[0].kg : null;
    const imc = cur != null ? cur / (ht * ht) : null;
    const left = cur != null ? cur - goal : null;
    let h = '<div class="stats">' +
      '<div class="stat"><span class="lbl">Actual</span><span class="v">' + (cur != null ? fmt(cur) : "-") + " <small>kg</small></span></div>" +
      '<div class="stat"><span class="lbl">' + (left != null && left <= 0 ? "Meta" : "Falta para la meta") + '</span><span class="v">' + (left == null ? "-" : left <= 0 ? "Alcanzada" : fmt(left) + " <small>kg</small>") + "</span></div>" +
      '<div class="stat"><span class="lbl">Desde el inicio</span><span class="v">' + (cur != null && first != null ? (cur - first > 0 ? "+" : "") + fmt(cur - first) + " <small>kg</small>" : "-") + "</span></div>" +
      '<div class="stat"><span class="lbl">IMC (' + fmt(ht) + ' m)</span><span class="v">' + (imc != null ? fmt(imc) : "-") + "</span></div></div>";
    h += '<section class="card"><h2 style="font-size:22px">Evolución</h2>' + lineChart(ws.map(w => ({ x: new Date(w.d + "T12:00:00").getTime(), y: w.kg, d: w.d })), { goal, label: "Peso en el tiempo" }) + "</section>";
    h += '<section class="card"><h2 style="font-size:22px">Añadir peso</h2><div class="row"><label class="field"><span class="lbl">Fecha</span><input id="w-d" type="date" value="' + todayStr() + '"></label>' +
      '<label class="field"><span class="lbl">Peso (kg)</span><input id="w-k" inputmode="decimal" placeholder="' + (cur != null ? fmt(cur) : "78") + '"></label></div><button class="btn pri" data-act="addw">Añadir</button></section>';
    h += '<section class="card"><h2 style="font-size:22px">Registros</h2>' + (ws.length ? '<div class="list">' + ws.slice().reverse().map(w =>
      '<div class="li"><div><div class="k">' + fmt(w.kg) + ' kg</div><div class="d">' + esc(fmtDateY(w.d)) + '</div></div><button class="btn sm ghost danger" data-act="delw" data-d="' + w.d + '">' + (S.confirm === w.d ? "¿Seguro?" : "Borrar") + "</button></div>").join("") + "</div>" : '<p class="muted">Todavía no hay pesos. Añade el primero arriba.</p>') + "</section>";
    return h;
  }
  function viewHist() {
    const ids = Object.keys(S.sessions).filter(k => S.sessions[k] && S.sessions[k].entries).sort().reverse();
    const names = new Set(); ids.forEach(id => S.sessions[id].entries.forEach(e => names.add(e.n)));
    const nm = Array.from(names).sort((a, b) => a.localeCompare(b, "es"));
    if (!S.exSel || !names.has(S.exSel)) S.exSel = nm[0] || null;
    let h = '<section class="card"><h2 style="font-size:22px">Progreso por ejercicio</h2>';
    if (!nm.length) h += '<p class="muted">Cuando registres series en Hoy, aquí verás cómo evoluciona cada ejercicio.</p>';
    else {
      const hist = historyFor(S.exSel, null).slice().reverse();
      const pts = hist.map(x => { const ks = x.s.map(y => y.k).filter(v => v != null); return ks.length ? { x: new Date(x.date + "T12:00:00").getTime(), y: Math.max(...ks), d: x.date } : null; }).filter(Boolean);
      h += '<label class="field"><span class="lbl">Ejercicio</span><select id="exSel">' + nm.map(n => '<option value="' + esc(n) + '"' + (n === S.exSel ? " selected" : "") + ">" + esc(n) + "</option>").join("") + "</select></label>";
      if (pts.length) h += lineChart(pts, { label: "Kilos máximos por sesión" });
      h += '<div class="scroll-x"><table><thead><tr><th>Fecha</th><th>Sem.</th><th>Series</th></tr></thead><tbody>' + hist.slice().reverse().slice(0, 12).map(x =>
        "<tr><td>" + esc(fmtDate(x.date)) + "</td><td>" + (x.week || "-") + "</td><td>" + esc(x.s.map(y => (y.k == null ? "-" : fmt(y.k)) + "×" + (y.r == null ? "-" : fmt(y.r))).join("  ")) + "</td></tr>").join("") + "</tbody></table></div>";
    }
    h += "</section>";
    h += '<section class="card"><h2 style="font-size:22px">Sesiones</h2>' + (ids.length ? ids.slice(0, 60).map(id => {
      const d = S.sessions[id];
      return "<details><summary><span>" + esc(fmtDateY(d.date)) + " · " + esc(d.session) + '</span><span class="muted">sem. ' + (d.week || "-") + "</span></summary><ul>" +
        d.entries.map(e => "<li>" + esc(e.n) + ": " + esc(e.s.map(y => (y.k == null ? "" : fmt(y.k) + "×") + (y.r == null ? "-" : fmt(y.r))).join(" · ")) + "</li>").join("") + "</ul></details>";
    }).join("") : '<p class="muted">Sin sesiones registradas todavía.</p>') + "</section>";
    return h;
  }
  function viewAjustes() {
    const st = S.settings;
    return '<section class="card"><h2 style="font-size:22px">Tus datos</h2><div class="row"><label class="field"><span class="lbl">Meta (kg)</span><input id="a-g" inputmode="decimal" value="' + esc(String(st.goal).replace(".", ",")) + '"></label>' +
      '<label class="field"><span class="lbl">Altura (m)</span><input id="a-h" inputmode="decimal" value="' + esc(String(st.height).replace(".", ",")) + '"></label></div>' +
      '<div class="row"><label class="field"><span class="lbl">Inicio de la semana 1</span><input id="a-s" type="date" value="' + esc(st.start || "") + '"></label>' +
      '<label class="field"><span class="lbl">Semana actual</span><input id="a-w" inputmode="numeric" value="' + (st.week || 1) + '"></label></div>' +
      '<button class="btn pri" data-act="saveset">Guardar cambios</button></section>' +
      '<section class="card"><h2 style="font-size:22px">Cómo funciona</h2><ul class="muted" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">' +
      "<li>3 sesiones por semana en orden: Torso, Pierna, Full Body. Si faltas una, la repites.</li>" +
      "<li>Los básicos se mantienen 6 semanas y cambian tras cada deload. Los accesorios cambian cada semana.</li>" +
      "<li>Cuando llegas al máximo de reps en las 3 series, la app sugiere subir 2,5 kg.</li>" +
      "<li>La semana 6 de cada bloque es deload: 60% del peso.</li>" +
      "<li>Descansos: básicos 2 min, accesorios 60-90 s.</li></ul></section>" +
      '<section class="card"><h2 style="font-size:22px">Copia de seguridad</h2><p class="muted">' + (S.mode === "cloud" ? "Tus datos se guardan en tu cuenta y solo los ves tú." : "Los datos se guardan solo en este móvil, no en internet. Descarga una copia de vez en cuando.") + '</p><div id="exp"></div></section>';
  }

  function render() {
    pendingRender = false;
    const view = $("#view"); if (!view) return;
    $("#tabs").querySelectorAll("button").forEach(b => { if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    let h = "";
    if (S.error) h += '<div class="banner">' + esc(S.error) + "</div>";
    if (!S.loaded) h += '<section class="card"><p>Cargando tus datos…</p>' + (S.slow ? '<p class="muted">Tarda más de lo normal. Puede que no haya conexión; seguiré intentándolo.</p>' : "") + "</section>";
    else if (!S.settings) h += viewOnboarding();
    else {
      h += S.tab === "peso" ? viewPeso() : S.tab === "hist" ? viewHist() : S.tab === "ajustes" ? viewAjustes() : viewHoy();
    }
    view.innerHTML = h;
    const chip = $("#chip");
    if (S.settings) { const bi = blockInfo(S.settings.week || 1); chip.hidden = false; chip.textContent = "Sem " + (S.settings.week || 1) + " · B" + bi.block; } else chip.hidden = true;
    $("#rest").hidden = !(S.tab === "hoy" && S.settings && S.loaded);
    if (S.tab === "ajustes" && S.settings) mountExport();
    setStatus();
  }
  function softRender() {
    const a = document.activeElement;
    if (a && a.closest && a.closest("#view") && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { pendingRender = true; setStatus(); return; }
    render();
  }
  document.addEventListener("focusout", () => { if (pendingRender) setTimeout(() => { const a = document.activeElement; if (!(a && a.closest && a.closest("#view") && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) render(); }, 60); });

  /* CSV pensado para Excel en español: separador ; y coma decimal, con BOM para los acentos */
  const csvNum = v => v == null ? "" : String(v).replace(".", ",");
  const csvTxt = s => '"' + String(s).replace(/"/g, '""') + '"';
  function seriesCsv() {
    const rows = [["fecha", "semana", "bloque", "sesion", "ejercicio", "serie", "kg", "reps_o_segundos"]];
    Object.keys(S.sessions).sort().forEach(id => {
      const d = S.sessions[id]; if (!d || !d.entries) return;
      const bi = blockInfo(d.week || 1);
      d.entries.forEach(e => e.s.forEach((x, j) => {
        if (x.k == null && x.r == null) return;
        rows.push([d.date, d.week || "", bi.block, d.session, csvTxt(e.n), j + 1, csvNum(x.k), csvNum(x.r)]);
      }));
    });
    return "﻿" + rows.map(r => r.join(";")).join("\r\n");
  }
  function pesosCsv() {
    const rows = [["fecha", "peso_kg"]];
    Object.keys(S.weights).sort().forEach(d => rows.push([d, csvNum(S.weights[d])]));
    return "﻿" + rows.map(r => r.join(";")).join("\r\n");
  }
  function blobDl() {
    return { save: async ({ filename, data }) => {
      const type = filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/json";
      const url = URL.createObjectURL(new Blob([data], { type }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); return { status: "saved" };
    } };
  }
  function importData(d) {
    if (!d || typeof d !== "object") throw new Error("formato");
    let n = 0;
    if (d.ajustes && typeof d.ajustes.goal === "number" && typeof d.ajustes.height === "number" && !S.settings) { S.settings = { goal: d.ajustes.goal, height: d.ajustes.height, start: d.ajustes.start || todayStr(), week: Math.max(1, Math.floor(d.ajustes.week) || 1) }; n++; }
    Object.keys(d.pesos || {}).forEach(k => { if (/^\d{4}-\d\d-\d\d$/.test(k) && typeof d.pesos[k] === "number") { S.weights[k] = d.pesos[k]; n++; } });
    Object.keys(d.sesiones || {}).forEach(id => { const x = d.sesiones[id]; if (x && typeof x.date === "string" && SES.includes(x.session) && Array.isArray(x.entries)) { S.sessions[id] = clone(cleanDoc(x)); n++; } });
    if (!n) throw new Error("vacio");
    saveLocal(); render();
  }
  async function mountExport() {
    const box = $("#exp"); if (!box) return;
    let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (!dl) dl = blobDl();
    box.innerHTML = '<div class="row"><button class="btn" data-act="x-series">Series para Excel (.csv)</button><button class="btn" data-act="x-peso">Pesos para Excel (.csv)</button><button class="btn ghost" data-act="x-json">Copia completa (.json)</button></div>';
    const go = async (name, data) => {
      try { await dl.save({ filename: name, data }); toast("Archivo listo"); }
      catch (e) { if (!e || e.code !== "declined") toast("No se pudo descargar"); }
    };
    if (P.mode === "local") {
      box.insertAdjacentHTML("beforeend", '<div class="row" style="margin-top:10px"><button class="btn ghost" id="imp">Importar copia (.json)</button><input id="impf" type="file" accept=".json,application/json" hidden></div><p class="muted" style="margin-top:6px">Importar suma los datos de la copia a los que ya tienes en este móvil.</p>');
      const impf = box.querySelector("#impf");
      box.querySelector("#imp").onclick = () => impf.click();
      impf.onchange = () => {
        const f = impf.files && impf.files[0]; if (!f) return;
        const fr = new FileReader();
        fr.onload = () => { try { importData(JSON.parse(fr.result)); toast("Copia importada"); } catch (e) { toast("Archivo no válido"); } };
        fr.readAsText(f);
      };
    }
    box.querySelector('[data-act="x-series"]').onclick = () => go("series-" + todayStr() + ".csv", seriesCsv());
    box.querySelector('[data-act="x-peso"]').onclick = () => go("pesos-" + todayStr() + ".csv", pesosCsv());
    box.querySelector('[data-act="x-json"]').onclick = () => go("cuaderno-de-pesas-" + todayStr() + ".json", JSON.stringify({ ajustes: S.settings, pesos: S.weights, sesiones: S.sessions }, null, 2));
  }
  let toastT = null;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }

  /* ---------- eventos ---------- */
  function setWeek(w) { S.settings.week = Math.max(1, w); saveSettingsSoon(); render(); }
  document.addEventListener("click", ev => {
    const t = ev.target.closest("button"); if (!t) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.ses) { S.ses = t.dataset.ses; S.sesTouched = true; render(); return; }
    if (t.dataset.rest !== undefined) { startRest(Number(t.dataset.rest)); return; }
    const a = t.dataset.act; if (!a) return;
    if (a === "wk+") setWeek((S.settings.week || 1) + 1);
    else if (a === "wk-") setWeek((S.settings.week || 1) - 1);
    else if (a === "fill") {
      const i = Number(t.dataset.ex), kg = Number(t.dataset.kg), it = planFor(S.settings.week || 1, S.ses)[i];
      for (let j = 0; j < 3; j++) updateSet(it, j, "k", String(kg));
      render();
    } else if (a === "onboard") {
      const w = num($("#o-w").value), g = num($("#o-g").value), h = num($("#o-h").value), s = $("#o-s").value;
      if (!(w >= 30 && w <= 250) || !(g >= 30 && g <= 250) || !(h >= 1.2 && h <= 2.4)) { toast("Revisa peso, meta y altura"); return; }
      S.settings = { goal: g, height: h, start: s || todayStr(), week: 1 }; S.weights[todayStr()] = w;
      saveSettings(); saveWeight(todayStr(), w); render();
    } else if (a === "addw") {
      const d = $("#w-d").value, k = num($("#w-k").value);
      if (!d || !(k >= 30 && k <= 250)) { toast("Escribe fecha y un peso válido"); return; }
      S.weights[d] = k; saveWeight(d, k); render(); toast("Peso añadido");
    } else if (a === "delw") {
      const d = t.dataset.d;
      if (S.confirm === d) { delete S.weights[d]; S.confirm = null; deleteWeight(d); render(); }
      else { S.confirm = d; render(); setTimeout(() => { if (S.confirm === d) { S.confirm = null; render(); } }, 3000); }
    } else if (a === "saveset") {
      const g = num($("#a-g").value), h = num($("#a-h").value), w = num($("#a-w").value), s = $("#a-s").value;
      if (!(g >= 30 && g <= 250) || !(h >= 1.2 && h <= 2.4) || !(w >= 1)) { toast("Revisa los valores"); return; }
      S.settings = { goal: g, height: h, start: s || S.settings.start, week: Math.floor(w) }; saveSettings(); render(); toast("Guardado");
    }
  });
  function updateSet(it, j, f, raw) {
    const v = num(raw); if (Number.isNaN(v)) return;
    const st = S.settings, id = sessionId(S.date, S.ses);
    let doc = S.sessions[id];
    if (!doc) { doc = { date: S.date, session: S.ses, week: st.week || 1, entries: [] }; S.sessions[id] = doc; }
    doc.week = st.week || 1;
    let e = doc.entries.find(x => x.n === it.n);
    if (!e) { e = { n: it.n, s: [{ k: null, r: null }, { k: null, r: null }, { k: null, r: null }] }; doc.entries.push(e); }
    e.s[j][f] = v; scheduleSession(id);
  }
  document.addEventListener("input", ev => {
    const el = ev.target; if (!el.dataset || el.dataset.ex === undefined || !S.settings) return;
    const it = planFor(S.settings.week || 1, S.ses)[Number(el.dataset.ex)];
    updateSet(it, Number(el.dataset.set), el.dataset.f, el.value);
  });
  document.addEventListener("change", ev => {
    const el = ev.target;
    if (el.id === "dateIn" && el.value) { S.date = el.value; render(); }
    else if (el.id === "exSel") { S.exSel = el.value; render(); }
  });

  /* ---------- temporizador de descanso ---------- */
  let endAt = 0, tick = null;
  function startRest(sec) {
    clearInterval(tick); const el = $("#restT");
    if (!sec) { el.textContent = "Descanso"; return; }
    endAt = Date.now() + sec * 1000;
    const upd = () => {
      const left = Math.ceil((endAt - Date.now()) / 1000);
      if (left <= 0) { clearInterval(tick); el.textContent = "¡Ya!"; try { navigator.vibrate && navigator.vibrate(300); } catch (e) { /* sin vibración */ } return; }
      el.textContent = Math.floor(left / 60) + ":" + pad(left % 60);
    };
    upd(); tick = setInterval(upd, 250);
  }

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* opcional */ }
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("./sw.js").catch(() => {});
  render();
  initStore();
})();
</script>
</body>
